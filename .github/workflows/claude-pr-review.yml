# On-demand PR review by Claude, invoked by commenting "@claude review" on a PR.
# The logic lives in a shared reusable workflow so every OpenMRS repo stays in
# sync; see openmrs/openmrs-contrib-gha-workflows. Tracking @main while the
# reusable is still being refined; this will be pinned to a @v1 tag once it
# stabilises. Defaults there are Opus 4.8 at max effort; override via `with:`.
name: Claude PR Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/claude-pr-review.yml@main
    secrets: inherit
    with:
      # Audit mode: log Claude's full transcript (incl. the reasoning behind a
      # clean verdict) to the Actions run. Turn off once trust is established.
      show_full_output: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
